name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Training maths
        run: npm test
      - name: Rust toolchain
        run: rustup target add wasm32-unknown-unknown
      - name: DSP unit tests
        run: cd dsp && cargo test --lib --target x86_64-unknown-linux-gnu
      - name: Build WASM and check it matches the committed binary
        run: |
          npm run build:wasm
          git diff --stat --exit-code public/dsp.wasm || echo "::warning::public/dsp.wasm differs from a fresh build. Commit the rebuilt file."
      - name: DSP performance budget
        run: npm run bench
      - name: End-to-end (headless Chrome)
        run: CHROME_PATH=$(which google-chrome) npm run test:e2e
